<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego del dado</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Signature&display=swap" rel="stylesheet">
</head>
<body>

    <div class="all">
        <div class="header">
            <h1>Recargame</h1>
        </div>
        <div class="content">
            <div class="players">
                <p>Jugador 1</p>
                <p>Jugador 2</p>
            </div>
            <div class="dice">
                <div class="one">
                    <div class="rowOne">
                        <div class="pointOne"></div>
                        <div class="pointTwo"></div>
                        <div class="pointThree"></div>
                    </div>
                    <div class="rowTwo">
                        <div class="pointFour"></div>
                        <div class="pointFive"></div>
                        <div class="pointSix"></div>
                    </div>
                    <div class="rowThree">
                        <div class="pointSeven"></div>
                        <div class="pointEight"></div>
                        <div class="pointNine"></div>
                    </div>
                </div>

                <div class="two">
                    <div class="rowOne">
                        <div class="pointOne"></div>
                        <div class="pointTwo"></div>
                        <div class="pointThree"></div>
                    </div>
                    <div class="rowTwo">
                        <div class="pointFour"></div>
                        <div class="pointFive"></div>
                        <div class="pointSix"></div>
                    </div>
                    <div class="rowThree">
                        <div class="pointSeven"></div>
                        <div class="pointEight"></div>
                        <div class="pointNine"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="foot">
            <p>Hecho por John Peralta</p>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
